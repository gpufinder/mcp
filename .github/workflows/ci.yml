name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly keyless smoke test against the live endpoint (tools/list must still work).
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test against production (keyless)
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node dist/cli.js mcp > out.jsonl
          grep -q '"get_market_snapshot"' out.jsonl
